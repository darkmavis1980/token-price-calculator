name: "Build Artifacts"

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

env:
  PROJECT_NAME: calculator

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    env:
      ARCHIVE_NAME: token_calculator-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.target }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build
      run: cargo build --release --locked --target ${{ matrix.target }}

    # tar.gz keeps the executable bit on Linux/macOS, so the binary runs without chmod
    - name: Package (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir artifacts
        tar -czf "artifacts/${ARCHIVE_NAME}.tar.gz" -C "target/${{ matrix.target }}/release" "${PROJECT_NAME}"
        echo "ASSET=artifacts/${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        mkdir artifacts
        Compress-Archive -Path target/${{ matrix.target }}/release/$env:PROJECT_NAME.exe -DestinationPath artifacts/$env:ARCHIVE_NAME.zip
        "ASSET=artifacts/$env:ARCHIVE_NAME.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

    # archive: false uploads the tar.gz/zip as-is instead of wrapping it in another zip
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: ${{ env.ASSET }}
        archive: false
        retention-days: 30
